<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming de Vídeo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
</head>

<body>
    <h1>Streaming de Vídeo</h1>
    <img id="videoStream" width="640" height="480" alt="Streaming de vídeo">
    <br>
    <hr>
    <img id="videoStream2" width="640" height="480" alt="Streaming de vídeo">
    <hr>
    <img id="videoStream3" width="640" height="480" alt="Streaming de vídeo">
    <script>
        const socket = io("http://127.0.0.1:5000", { transports: ["websocket"] });
        const streamId = 1; // ID da stream
        // Variável para evitar chamadas excessivas
        let lastSubscriptionTime = 0;
        const subscriptionInterval = 5000; // 5 segundos

        function startStream() {
            socket.emit("start_stream", { id: streamId, url: "URL_DO_VIDEO", width: 640, height: 480, fps: 10 });
        }

        function stopStream() {
            socket.emit("stop_stream", { id: streamId });
        }

        socket.on(`frame_${streamId}`, (data) => {
            const img = document.getElementById("videoStream");
            img.src = "data:image/jpeg;base64," + arrayBufferToBase64(data);
        });

        socket.on(`frame_2`, (data) => {
            const img = document.getElementById("videoStream2");
            img.src = "data:image/jpeg;base64," + arrayBufferToBase64(data);
        });
        socket.on(`frame_3`, (data) => {
            const img = document.getElementById("videoStream3");

            img.src = "data:image/jpeg;base64," + arrayBufferToBase64(data);
            const now = Date.now();
            if (now - lastSubscriptionTime > subscriptionInterval) {
                socket.emit("subscribe_stream", { id: 3 });
                lastSubscriptionTime = now;
            }
        });
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        socket.on("connect", () => {
            console.log("Conectado ao servidor");
        });

        socket.on("disconnect", () => {
            console.log("Desconectado do servidor");
        });

        // Fechar o socket antes de sair da página
        window.addEventListener("beforeunload", () => {
            socket.disconnect();
        });
    </script>
</body>

</html>
